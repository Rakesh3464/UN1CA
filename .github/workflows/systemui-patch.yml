name: Patch SystemUI.apk

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 'a21s'

      - name: Install Tools & Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool.jar

      - name: Download SystemUI.apk
        run: |
          wget -O SystemUI.apk "https://nei5-a0eace4761b8.herokuapp.com/stream/325311?hash=960c8a&d=true"

      - name: Decompile SystemUI.apk
        run: |
          apktool d -f SystemUI.apk -o decompiled_ui
          # Backup original layout xml that causes crash
          cp decompiled_ui/res/layout/media_projection_app_selector.xml media_projection_app_selector.xml.bak || true

      - name: Fix Manifest Only (Skip Risky XML Edits)
        run: |
          python3 -c '
          import glob, re
          for filepath in glob.glob("decompiled_ui/**/AndroidManifest.xml", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              content = re.sub(r"\s*android:featureFlag=\"[^\"]*\"", "", content)
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(content)
          print("Manifest patched successfully!")
          '
          # Restore the crashing layout file to prevent malformed xml token error
          [ -f media_projection_app_selector.xml.bak ] && cp media_projection_app_selector.xml.bak decompiled_ui/res/layout/media_projection_app_selector.xml || true

      - name: Recompile and Sign SystemUI.apk
        run: |
          # Recompile without strict aapt2 validation if possible, or fallback
          apktool b decompiled_ui -o patched_SystemUI.apk --use-aapt2 || apktool b decompiled_ui -o patched_SystemUI.apk
          
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
          java -jar signer.jar -apks patched_SystemUI.apk --allowResign

      - name: Upload Patched SystemUI
        uses: actions/upload-artifact@v4
        with:
          name: Patched-SystemUI-A21s
          path: patched_SystemUI.apk
          
